<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self';">
  <meta http-equiv="X-Content-Type-Options" content="nosniff">
  <title>Acrostic CipherLab</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="container">
    <h1>Acrostic CipherLab</h1>

    <div class="tabs" role="tablist">
      <button id="tab-btn-basic" class="tab active" data-tab="basic" role="tab" aria-selected="true" aria-controls="tab-basic">アクロスティック</button>
      <button id="tab-btn-advanced" class="tab" data-tab="advanced" role="tab" aria-selected="false" aria-controls="tab-advanced">拡張アクロスティック</button>
    </div>

    <div id="tab-basic" class="tab-content active" role="tabpanel" aria-labelledby="tab-btn-basic">
      <section class="panel">
        <h2>入力テキスト</h2>
        <textarea id="input-basic" aria-label="入力テキスト" placeholder="複数行のテキストを入力してください"></textarea>
        <button id="run-basic" class="btn-primary">抽出する</button>
        <h2>抽出結果</h2>
        <div class="output-wrapper">
          <textarea id="output-basic" aria-label="抽出結果" readonly placeholder="抽出された文字列がここに表示されます"></textarea>
          <div class="output-actions">
            <button id="copy-basic" class="btn-action" type="button" aria-label="結果をコピー">コピー</button>
            <button id="clear-basic" class="btn-action" type="button">クリア</button>
          </div>
        </div>
      </section>
    </div>

    <div id="tab-advanced" class="tab-content" role="tabpanel" aria-labelledby="tab-btn-advanced">
      <section class="panel">
        <h2>入力テキスト</h2>
        <textarea id="input-adv" aria-label="入力テキスト" placeholder="複数行のテキストを入力してください"></textarea>

        <div class="options">
          <div class="option-group">
            <label for="mode">抽出モード</label>
            <select id="mode">
              <option value="head">行頭から n 文字目</option>
              <option value="tail">行末から前に n 文字目</option>
              <option value="symbol">カンマ・ピリオド前の n 文字目</option>
            </select>
          </div>
          <div class="option-group">
            <label for="n">n の値</label>
            <input type="number" id="n" min="1" value="1">
          </div>
        </div>

        <button id="run-adv" class="btn-primary">抽出する</button>
        <h2>抽出結果</h2>
        <div class="output-wrapper">
          <textarea id="output-adv" aria-label="抽出結果" readonly placeholder="抽出された文字列がここに表示されます"></textarea>
          <div class="output-actions">
            <button id="copy-adv" class="btn-action" type="button" aria-label="結果をコピー">コピー</button>
            <button id="clear-adv" class="btn-action" type="button">クリア</button>
          </div>
        </div>
      </section>
    </div>
  </main>

  <footer>
    <div class="footer">
      🔗 GitHubリポジトリはこちら（
        <a href="https://github.com/ipusiron/acrostic-cipherlab" target="_blank" rel="noopener noreferrer">
          ipusiron/acrostic-cipherlab
        </a>
      ）
    </div>
  </footer>

  <script src="script.js"></script>
</body>
</html>
