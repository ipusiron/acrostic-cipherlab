<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; object-src 'none'; base-uri 'self'; form-action 'self'">
  <meta name="referrer" content="strict-origin-when-cross-origin">
  <title>Acrostic CipherLab</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="site-header">
    <button id="language-toggle" class="language-toggle" type="button" aria-label="表示言語を英語に切り替える">English</button>
    <h1>Acrostic CipherLab</h1>
    <p>行ごとの文字位置をたどり、隠れたメッセージと抽出根拠を確認する学習ツール</p>
  </header>
  <main class="container">
    <div class="tabs" role="tablist" aria-label="抽出方法">
      <button id="tab-btn-basic" class="tab active" data-tab="basic" role="tab" aria-selected="true" aria-controls="tab-basic">アクロスティック</button>
      <button id="tab-btn-advanced" class="tab" data-tab="advanced" role="tab" aria-selected="false" aria-controls="tab-advanced">拡張アクロスティック</button>
    </div>

    <div id="tab-basic" class="tab-content active" role="tabpanel" aria-labelledby="tab-btn-basic">
      <section class="panel">
        <h2>入力テキスト</h2>
        <textarea id="input-basic" aria-label="入力テキスト" placeholder="複数行のテキストを入力してください"></textarea>
        <div class="options">
          <div class="option-group">
            <label for="normalization-basic">Unicode正規化</label>
            <select id="normalization-basic">
              <option value="none">正規化しない</option>
              <option value="NFC">NFC</option>
              <option value="NFKC">NFKC</option>
            </select>
          </div>
          <label class="check-option" for="trim-basic">
            <input id="trim-basic" type="checkbox" checked>
            行頭の空白を無視する
          </label>
        </div>
        <button id="run-basic" class="btn-primary">抽出する</button>
        <h2>抽出結果</h2>
        <div class="output-wrapper">
          <textarea id="output-basic" aria-label="抽出結果" readonly placeholder="抽出された文字列がここに表示されます"></textarea>
          <div class="output-actions">
            <button id="copy-basic" class="btn-action" type="button" aria-label="結果をコピー">コピー</button>
            <button id="clear-basic" class="btn-action" type="button">クリア</button>
          </div>
        </div>
        <div id="summary-basic" class="result-summary" aria-live="polite"></div>
        <details class="trace-details" open>
          <summary>抽出の追跡表</summary>
          <div class="table-scroll" tabindex="0" aria-label="基本抽出の追跡表">
            <table>
              <thead><tr><th>行</th><th>処理</th><th>位置</th><th>文字</th><th>理由</th></tr></thead>
              <tbody id="trace-basic"></tbody>
            </table>
          </div>
        </details>
      </section>
    </div>

    <div id="tab-advanced" class="tab-content" role="tabpanel" aria-labelledby="tab-btn-advanced">
      <section class="panel">
        <h2>入力テキスト</h2>
        <textarea id="input-adv" aria-label="入力テキスト" placeholder="複数行のテキストを入力してください"></textarea>

        <div class="options">
          <div class="option-group">
            <label for="mode">抽出モード</label>
            <select id="mode">
              <option value="head">行頭から n 文字目</option>
              <option value="tail">行末から前に n 文字目</option>
              <option value="symbol">カンマ・ピリオド前の n 文字目</option>
            </select>
          </div>
          <div class="option-group" id="punctuation-group" hidden>
            <label for="punctuation">対象の句読点</label>
            <select id="punctuation">
              <option value="both">, . 、 。</option>
              <option value="western">, .</option>
              <option value="japanese">、 。</option>
            </select>
          </div>
          <div class="option-group">
            <label for="n">n の値</label>
            <input type="number" id="n" min="1" value="1">
          </div>
          <div class="option-group">
            <label for="normalization-adv">Unicode正規化</label>
            <select id="normalization-adv">
              <option value="none">正規化しない</option>
              <option value="NFC">NFC</option>
              <option value="NFKC">NFKC</option>
            </select>
          </div>
          <label class="check-option" for="trim-adv">
            <input id="trim-adv" type="checkbox" checked>
            行頭の空白を無視する
          </label>
        </div>

        <button id="run-adv" class="btn-primary">抽出する</button>
        <h2>抽出結果</h2>
        <div class="output-wrapper">
          <textarea id="output-adv" aria-label="抽出結果" readonly placeholder="抽出された文字列がここに表示されます"></textarea>
          <div class="output-actions">
            <button id="copy-adv" class="btn-action" type="button" aria-label="結果をコピー">コピー</button>
            <button id="clear-adv" class="btn-action" type="button">クリア</button>
          </div>
        </div>
        <div id="summary-adv" class="result-summary" aria-live="polite"></div>
        <details class="trace-details" open>
          <summary>抽出の追跡表</summary>
          <div class="table-scroll" tabindex="0" aria-label="拡張抽出の追跡表">
            <table>
              <thead><tr><th>行</th><th>処理</th><th>位置</th><th>文字</th><th>理由</th></tr></thead>
              <tbody id="trace-adv"></tbody>
            </table>
          </div>
        </details>
      </section>
    </div>
  </main>

  <footer>
    <div class="footer">
      🔗 GitHubリポジトリはこちら（
        <a href="https://github.com/ipusiron/acrostic-cipherlab" target="_blank" rel="noopener noreferrer">
          ipusiron/acrostic-cipherlab
        </a>
      ）
    </div>
  </footer>

  <script src="acrostic-core.js"></script>
  <script src="i18n.js"></script>
  <script src="script.js"></script>
</body>
</html>
